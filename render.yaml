# Render Blueprint for the hosted technical preview.
#
# Render pulls the image CI builds and pushes to GHCR on every push to
# main (see .github/workflows/fast.yml's `image` job) -- there is no
# build step on Render's side. The GHCR package needs to be public (or
# Render needs a registry credential configured in its dashboard) for
# this to pull without authentication.
#
# Single stateless service hosting the current preview and /health.
# The image exposes illustrative example endpoints and the bounded synchronous
# simulation API. Deployment of a new image and public availability must be
# verified separately; this blueprint does not establish production readiness.
services:
  - type: web
    name: daysofcover
    runtime: image
    image:
      url: ghcr.io/nathantaylorops/daysofcover:main
    plan: free
    healthCheckPath: /health
