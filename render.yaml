# Render Blueprint for the Stage 0 placeholder deploy.
#
# Render pulls the image CI builds and pushes to GHCR on every push to
# main (see .github/workflows/fast.yml's `image` job) -- there is no
# build step on Render's side. The GHCR package needs to be public (or
# Render needs a registry credential configured in its dashboard) for
# this to pull without authentication.
#
# This is Stage 0 only: one service, no persistence, no custom domain.
# The static-SPA-plus-separate-API split described in the build plan's
# "Hosted demo" decision lands once the real UI exists (Stage 6+); until
# then this one service serves both the placeholder page and /health.
services:
  - type: web
    name: daysofcover
    runtime: image
    image:
      url: ghcr.io/nathantaylorops/daysofcover:main
    plan: free
    healthCheckPath: /health
