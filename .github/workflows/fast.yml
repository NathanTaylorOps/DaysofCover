name: fast

# Runs on every push and pull request. Target: under three minutes.
# Lint, format, types, unit tests, wheel build and a smoke test of the built wheel.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest -m "not validation"

  wheel:
    name: build and smoke-test the wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Install the wheel into a clean environment and run it
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          uv run --isolated --no-project --python 3.12 --with "$whl" -- daysofcover --version | tee out.txt
          grep -q "^daysofcover 0\." out.txt
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7
