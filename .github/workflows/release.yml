name: release

# Runs when a v* tag is pushed. Builds the wheel/sdist, publishes to PyPI,
# attaches a CycloneDX SBOM to a GitHub Release, and cuts the release that
# Zenodo mints a DOI for (once the repo is linked on zenodo.org - a
# one-time manual step, not done by this workflow).
#
# A Docker image build and GHCR push is added once the Dockerfile lands
# (a later Stage 0 session); there is nothing to build into an image yet.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # for PyPI trusted publishing

jobs:
  build:
    name: build wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          uv run --isolated --no-project --python 3.12 --with "$whl" -- daysofcover --version
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 30

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          uv export --locked --no-dev --format requirements-txt > requirements.txt
          uv run --with cyclonedx-bom cyclonedx-py requirements -o sbom.json requirements.txt
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  publish-pypi:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create GitHub Release
    needs: [build, sbom, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v6
        with:
          name: sbom
          path: .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.json
